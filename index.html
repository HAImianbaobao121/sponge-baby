  transition: opacity .2s;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--danger);
  font-size: 14px;
  flex-shrink: 0;
}

.checkin-item:hover .checkin-delete { opacity: 1; }

/* ==================== 备忘录 ==================== */
.memo-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.memo-tab {
  padding: 7px 16px;
  border-radius: 20px;
  background: var(--bg-card);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-sub);
  box-shadow: var(--shadow);
  transition: all .2s;
  display: flex;
  align-items: center;
  gap: 5px;
}

.memo-tab.active {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
}

.memo-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px;
  border-radius: var(--radius-sm);
  background: var(--bg-main);
  margin-bottom: 8px;
  transition: all .2s;
}

.memo-item:hover { background: var(--bg-hover); }

.memo-checkbox {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  border: 2px solid var(--primary-light);
  flex-shrink: 0;
  margin-top: 1px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 12px;
  transition: all .2s;
}

.memo-checkbox.checked {
  background: var(--primary);
  border-color: var(--primary);
}

.memo-content { flex: 1; min-width: 0; }
.memo-text {
  font-size: 15px;
  word-break: break-all;
}
.memo-item.done .memo-text {
  text-decoration: line-through;
  color: var(--text-light);
}
.memo-meta {
  font-size: 11px;
  color: var(--text-light);
  margin-top: 4px;
}

.memo-actions {
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity .2s;
}
.memo-item:hover .memo-actions { opacity: 1; }

/* ==================== 选题灵感 ==================== */
.inspiration-section { margin-bottom: 24px; }

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  gap: 10px;
}

.section-title {
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}

.hot-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
  margin-bottom: 10px;
  border-left: 3px solid var(--primary);
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
}
.hot-card:active { transform: scale(.98); }

.hot-card.dy { border-left-color: #333; }
.hot-card.xhs { border-left-color: #FF2442; }

.hot-card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.hot-platform {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 6px;
}
.hot-platform.dy { background: #333; color: #fff; }
.hot-platform.xhs { background: #FF2442; color: #fff; }
.hot-platform.hot { background: linear-gradient(135deg, #FE2C55, #FF0050); color: #fff; }

.hot-card.hot-trend { border-left-color: #FE2C55; }

.hot-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 6px;
  line-height: 1.4;
}

.hot-title a {
  color: inherit;
  text-decoration: none;
}
.hot-title a:active { color: var(--primary-dark); }

.hot-meta {
  font-size: 12px;
  color: var(--text-light);
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}

.hot-link-btn {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  transition: opacity .15s;
}
.hot-link-btn:active { opacity: .7; }
.hot-link-btn.dy { background: #333; color: #fff; }
.hot-link-btn.xhs { background: #FF2442; color: #fff; }

.hot-tags {
  display: flex;
  gap: 5px;
  margin-top: 6px;
  flex-wrap: wrap;
}

.hot-tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 12px;
  background: var(--primary-bg);
  color: var(--primary-dark);
}

.auto-collect-info {
  background: linear-gradient(135deg, #FFF5F7, #F0EAFF);
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-sub);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.idea-item {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
  margin-bottom: 10px;
  border-left: 3px solid var(--secondary);
}

.idea-text {
  font-size: 15px;
  margin-bottom: 8px;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.5;
}

.idea-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.idea-time {
  font-size: 11px;
  color: var(--text-light);
}

.idea-actions {
  display: flex;
  gap: 6px;
  opacity: 0;
  transition: opacity .2s;
}
.idea-item:hover .idea-actions { opacity: 1; }

.idea-link {
  margin-bottom: 8px;
}
.idea-link a {
  font-size: 12px;
  color: var(--primary-dark);
  text-decoration: none;
  word-break: break-all;
}
.idea-link a:active { opacity: .7; }

/* ==================== 体重记录 ==================== */
.weight-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}

.stat-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
  text-align: center;
}

.stat-label {
  font-size: 12px;
  color: var(--text-light);
  margin-bottom: 4px;
}

.stat-value {
  font-size: 22px;
  font-weight: 700;
  color: var(--primary-dark);
}
.stat-value .unit { font-size: 12px; font-weight: 400; }

.stat-trend {
  font-size: 11px;
  margin-top: 2px;
}
.stat-trend.up { color: var(--danger); }
.stat-trend.down { color: var(--success); }

.weight-chart-wrap {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
  overflow-x: auto;
}

.weight-chart {
  min-width: 300px;
  height: 180px;
}

.weight-input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  align-items: center;
}

.weight-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.weight-table th {
  text-align: left;
  padding: 8px 6px;
  color: var(--text-light);
  font-weight: 600;
  border-bottom: 1.5px solid var(--border);
  font-size: 12px;
}

.weight-table td {
  padding: 9px 6px;
  border-bottom: 1px solid var(--border);
}

.weight-table tr:hover { background: var(--bg-hover); }

.dinner-record {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  background: var(--bg-main);
  margin-bottom: 8px;
}

.dinner-date { font-size: 14px; font-weight: 500; }
.dinner-day { font-size: 11px; color: var(--text-light); }

.dinner-toggle {
  display: flex;
  gap: 6px;
}

.dinner-btn {
  padding: 5px 14px;
  border-radius: 16px;
  font-size: 12px;
  font-weight: 600;
  background: var(--bg-card);
  color: var(--text-sub);
  transition: all .2s;
}

.dinner-btn.active.eat {
  background: rgba(255, 140, 148, 0.15);
  color: var(--danger);
}

.dinner-btn.active.noeat {
  background: rgba(107, 203, 119, 0.15);
  color: var(--success);
}

/* ==================== 收支明细 ==================== */
.finance-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}

.summary-card {
  border-radius: var(--radius);
  padding: 16px;
  color: #fff;
  position: relative;
  overflow: hidden;
}

.summary-card.income { background: linear-gradient(135deg, #6BCB77, #4FA859); }
.summary-card.expense { background: linear-gradient(135deg, #FF8C94, #FF6B7A); }
.summary-card.extra { background: linear-gradient(135deg, #B5A8FF, #8E7FE8); }

.summary-label { font-size: 12px; opacity: .9; margin-bottom: 4px; }
.summary-amount { font-size: 20px; font-weight: 700; }
.summary-amount .unit { font-size: 12px; font-weight: 400; }

.summary-icon {
  position: absolute;
  right: 10px;
  bottom: 6px;
  font-size: 32px;
  opacity: .25;
}

.finance-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.finance-tab {
  padding: 7px 16px;
  border-radius: 20px;
  background: var(--bg-card);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-sub);
  box-shadow: var(--shadow);
  transition: all .2s;
}

.finance-tab.active {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
}

.finance-main-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.finance-main-tabs::-webkit-scrollbar { display: none; }

.finance-main-tab {
  padding: 8px 14px;
  border-radius: 20px;
  background: var(--bg-card);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-sub);
  box-shadow: var(--shadow);
  transition: all .2s;
  white-space: nowrap;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
}

.finance-main-tab.active {
  background: linear-gradient(135deg, var(--secondary), #8E7FE8);
  color: #fff;
}

.finance-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 14px;
  border-radius: var(--radius-sm);
  background: var(--bg-main);
  margin-bottom: 8px;
}

.finance-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.finance-icon.income { background: rgba(107,203,119,.15); }
.finance-icon.expense { background: rgba(255,140,148,.15); }
.finance-icon.extra { background: rgba(181,168,255,.15); }

.finance-info { flex: 1; min-width: 0; }
.finance-desc { font-size: 14px; font-weight: 500; }
.finance-meta { font-size: 11px; color: var(--text-light); margin-top: 2px; }

.finance-amount {
  font-size: 15px;
  font-weight: 700;
  flex-shrink: 0;
}
.finance-amount.plus { color: var(--success); }
.finance-amount.minus { color: var(--danger); }

.finance-category-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.cat-chip {
  padding: 5px 12px;
  border-radius: 16px;
  background: var(--bg-card);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-sub);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: all .2s;
}
.cat-chip.active {
  background: var(--primary);
  color: #fff;
}

/* ==================== 模态框 ==================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(61, 44, 74, 0.45);
  z-index: 500;
  display: none;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(2px);
}

.modal-overlay.show {
  display: flex;
  animation: fadeIn .2s;
}

.modal {
  background: #fff;
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 460px;
  padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0));
  animation: slideUp .3s ease;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.modal-title { font-size: 17px; font-weight: 700; }

.modal-close {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--bg-main);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: var(--text-sub);
}

.modal-body { margin-bottom: 18px; }

.form-group { margin-bottom: 14px; }
.form-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-sub);
  margin-bottom: 6px;
}

.modal-footer {
  display: flex;
  gap: 10px;
}
.modal-footer .btn { flex: 1; padding: 12px; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

/* ==================== Toast ==================== */
.toast {
  position: fixed;
  bottom: calc(30px + env(safe-area-inset-bottom, 0));
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: rgba(61, 44, 74, 0.92);
  color: #fff;
  padding: 10px 20px;
  border-radius: 24px;
  font-size: 13px;
  z-index: 999;
  transition: transform .3s ease;
  pointer-events: none;
  white-space: nowrap;
  max-width: 90%;
  overflow: hidden;
  text-overflow: ellipsis;
}

.toast.show { transform: translateX(-50%) translateY(0); }

/* ==================== 安装提示 ==================== */
.install-banner {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0));
  display: none;
  align-items: center;
  gap: 12px;
  z-index: 300;
  box-shadow: 0 -4px 20px rgba(0,0,0,.15);
}

.install-banner.show { display: flex; }

.install-banner-icon { font-size: 24px; }
.install-banner-text { flex: 1; font-size: 13px; line-height: 1.4; }
.install-banner-text b { font-size: 14px; }
.install-banner-btn {
  background: #fff;
  color: var(--primary-dark);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
}
.install-banner-close {
  color: rgba(255,255,255,.7);
  font-size: 18px;
  width: 28px;
  height: 28px;
}

/* ==================== 响应式 ==================== */
@media (max-width: 768px) {
  :root { --sidebar-w: 62px; }
  
  /* 移动端 → 左侧竖排图标导航栏 */
  .app { flex-direction: row; }
  
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 62px;
    height: 100%;
    max-width: 62px;
    transform: none;
    flex-shrink: 0;
    background: linear-gradient(180deg, #FFF5F8 0%, #FFF0F5 100%);
    border-right: 1px solid var(--border);
    border-bottom: none;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
    z-index: 100;
    flex-direction: column;
    align-items: center;
    gap: 0;
    overflow-y: auto;
  }
  
  .sidebar-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 4px 8px;
    gap: 4px;
    border-bottom: 1px solid rgba(255,159,181,.15);
    width: 100%;
  }
  
  .sidebar-logo {
    width: 36px;
    height: 36px;
    font-size: 18px;
  }
  
  .sidebar-title-wrap {
    display: none;
  }
  
  .sidebar-edit-btn {
    display: none;
  }
  
  .sidebar-footer {
    padding: 8px 0;
    text-align: center;
  }
  .sidebar-footer a { font-size: 11px; }
  
  .nav-list {
    display: flex;
    flex-direction: column;
    overflow: visible;
    padding: 8px 4px;
    gap: 4px;
    flex: 1;
    width: 100%;
    align-items: center;
  }
  
  .nav-item {
    flex-shrink: 0;
    white-space: nowrap;
    padding: 10px 0;
    border-radius: 12px;
    font-size: 10px;
    margin-bottom: 0;
    gap: 2px;
    flex-direction: column;
    width: 50px;
    min-height: 58px;
    justify-content: center;
    text-align: center;
  }
  
  .nav-icon { font-size: 24px; width: auto; height: auto; }
  .nav-label { font-size: 11px; }
  
  .menu-toggle { display: none !important; }
  .sidebar-overlay { display: none !important; }
  
  /* 移动端底部 mini 头像栏 */
  .mobile-bottom-bar { display: none !important; }
  
  .main {
    margin-left: 62px;
    overflow-y: auto;
    flex: 1;
    width: calc(100% - 62px);
  }
  
  .page-header { padding: 16px 14px 10px; }
  .page-content { padding: 0 14px 30px; }
  .page-title { font-size: 20px; }
  
  .card { padding: 14px; }
  
  .checkin-progress { padding: 14px; gap: 12px; }
  
  .weight-stats { grid-template-columns: 1fr 1fr; gap: 8px; }
  .weight-stats .stat-card:last-child { grid-column: 1 / -1; }
  .finance-summary { grid-template-columns: 1fr; }
  
  .stat-value { font-size: 18px; }
  .summary-amount { font-size: 18px; }
  
  .memo-actions, .idea-actions, .checkin-delete { opacity: 1; }
}

  .page-content { padding: 0 14px 30px; }
  .page-title { font-size: 20px; }
  
  .card { padding: 14px; }

/* 自定义滚动条 */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,159,181,.3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,159,181,.5); }

/* SVG 渐变定义 */
.svg-defs { position: absolute; width: 0; height: 0; }

/* ==================== 播客 ==================== */
.podcast-featured {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border-radius: var(--radius);
  padding: 24px;
  color: #fff;
  text-align: center;
  cursor: pointer;
  transition: transform .15s;
}
.podcast-featured:active { transform: scale(.98); }
.podcast-featured-badge {
  display: inline-block;
  background: rgba(255,255,255,.25);
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 12px;
}
.podcast-featured-icon { font-size: 48px; margin-bottom: 10px; }
.podcast-featured-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 6px;
}
.podcast-featured-author { font-size: 14px; opacity: .85; margin-bottom: 8px; }
.podcast-featured-desc { font-size: 13px; opacity: .75; line-height: 1.5; }

.podcast-card {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
  margin-bottom: 10px;
  cursor: pointer;
  transition: transform .15s;
}
.podcast-card:active { transform: scale(.98); }
.podcast-icon {
  font-size: 36px;
  flex-shrink: 0;
  width: 50px;
  text-align: center;
}
.podcast-info { flex: 1; min-width: 0; }
.podcast-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.podcast-author { font-size: 12px; color: var(--text-light); margin-bottom: 4px; }
.podcast-desc {
  font-size: 12px;
  color: var(--text-sub);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 6px;
}
.podcast-cat {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--primary-bg);
  color: var(--primary-dark);
}
.podcast-play {
  font-size: 22px;
  color: var(--primary);
  flex-shrink: 0;
}

/* ==================== 每日常识 ==================== */
.knowledge-date-badge {
  text-align: center;
  font-size: 13px;
  color: var(--text-sub);
  margin-bottom: 16px;
  padding: 8px;
  background: var(--primary-bg);
  border-radius: var(--radius-sm);
}
.knowledge-card {
  display: flex;
  gap: 14px;

<script>
/* ==================== 数据存储层 ==================== */
const STORAGE_PREFIX = 'spongeBaby_';
const DB_VERSION = '1.0';

const Store = {
  get(key, defaultValue = null) {
    try {
      const raw = localStorage.getItem(STORAGE_PREFIX + key);
      if (raw === null) return defaultValue;
      return JSON.parse(raw);
    } catch (e) {
      console.error('读取存储失败:', key, e);
      return defaultValue;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
      return true;
    } catch (e) {
      console.error('写入存储失败:', key, e);
      toast('存储空间不足，请清理浏览器数据');
      return false;
    }
  },
  remove(key) {
    localStorage.removeItem(STORAGE_PREFIX + key);
  }
};

/* ==================== 工具函数 ==================== */
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function nowTimeStr() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function dateTimeStr() {
  const d = new Date();
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function dayOfWeek(dateStr) {
  const days = ['周日','周一','周二','周三','周四','周五','周六'];
  return days[new Date(dateStr).getDay()];
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ==================== 应用名管理 ==================== */
let appName = Store.get('appName', '海绵饱饱');

function updateAppNameDisplay() {
  document.getElementById('appName').textContent = appName;
  document.getElementById('installAppName').textContent = appName;
  const mobileName = document.getElementById('mobileAppName');
  if (mobileName) mobileName.textContent = appName;
  document.title = appName;
  // 更新 PWA meta
  let meta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if (meta) meta.setAttribute('content', appName);
}

function editAppName() {
  showModal({
    title: '✏️ 修改应用名称',
    body: `
      <div class="form-group">
        <label class="form-label">应用名称</label>
        <input type="text" class="input" id="appNameInput" value="${escapeHtml(appName)}" maxlength="12" placeholder="输入新名称">
        <div style="font-size:12px;color:var(--text-light);margin-top:6px;">最多12个字符，添加到桌面后图标显示此名称</div>
      </div>
    `,
    onConfirm: () => {
      const val = document.getElementById('appNameInput').value.trim();
      if (!val) { toast('名称不能为空'); return false; }
      appName = val;
      Store.set('appName', appName);
      updateAppNameDisplay();
      toast('名称已更新');
      return true;
    }
  });
  setTimeout(() => document.getElementById('appNameInput').focus(), 100);
}

/* ==================== 页面路由 ==================== */
let currentPage = 'checkin';

function switchPage(page) {
  currentPage = page;

  if (window.innerWidth <= 768) {
    closeSidebar();
  }
  // 滚动到顶部
  document.getElementById('main').scrollTop = 0;
}

function renderPage(page) {
  const main = document.getElementById('main');
  switch (page) {
    case 'checkin': main.innerHTML = renderCheckin(); initCheckin(); break;
    case 'learn': main.innerHTML = renderLearn(); initLearn(); break;

const DEFAULT_TASKS = [

  { id: 't4', name: '晚上复习所学 30 分钟', time: '21:00' }
];

function getTasks() {
  return Store.get('checkin_tasks', DEFAULT_TASKS);
}

function getCheckinRecords() {
  // { '2026-07-28': ['t1','t3'] }
  return Store.get('checkin_records', {});
}

function getTodayChecked() {
  const records = getCheckinRecords();
  return records[todayStr()] || [];
}

function toggleCheckin(taskId) {
  const records = getCheckinRecords();
  const today = todayStr();
  if (!records[today]) records[today] = [];
  const idx = records[today].indexOf(taskId);
  if (idx >= 0) {
    records[today].splice(idx, 1);
  } else {
    records[today].push(taskId);
  }
  Store.set('checkin_records', records);
  // 重新渲染
  renderPage('checkin');
}

    '与其追光，不如成为光 💡',
    '你的时间花在哪里，人生的花就开在哪里 🌸',
    '把简单的事情做到极致，就是不简单 🏆',
    '今天也是闪闪发光的一天呀 ✨'
  ];
  const today = todayStr();
  const mottoSeed = parseInt(today.split('-').join('')) % MOTTO_BANK.length;
  const dailyMotto = MOTTO_BANK[mottoSeed];
  const circumference = 2 * Math.PI * 30;
  const offset = circumference - (percent / 100) * circumference;
  
  let taskListHtml = '';
  if (tasks.length === 0) {

      const isDone = checked.includes(t.id);
      return `
        <div class="checkin-item ${isDone ? 'done' : ''}">

          <div class="checkin-content" onclick="editTask('${t.id}')">
            <div class="checkin-name">${escapeHtml(t.name)}</div>
            <div class="checkin-time">⏰ ${escapeHtml(t.time || '全天')} <span style="font-size:10px;color:var(--primary-dark);margin-left:4px">✏️点击编辑</span></div>
          </div>
          <button class="checkin-delete" onclick="deleteTask('${t.id}')" title="删除">🗑</button>
        </div>
      `;
    }).join('');
  }

// 定时提醒
let notificationTimers = [];
function scheduleNotifications() {
  // 清除旧定时器
  notificationTimers.forEach(clearTimeout);
  notificationTimers = [];
  
  if (!('Notification' in window)) return;
  
  const tasks = getTasks();
  const now = new Date();
  
  tasks.forEach(t => {
    if (!t.time || t.time === '全天') return;
    const [h, m] = t.time.split(':').map(Number);
    const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
    const delay = target - now;
    
    if (delay > 0 && delay < 86400000) {
      const timer = setTimeout(() => {
        if (Notification.permission === 'granted') {
          new Notification('⏰ 海绵饱饱提醒', {
            body: '该完成「' + t.name + '」啦！',
            icon: 'icon.svg',
            tag: 'sponge-checkin-' + t.id
          });
        }
        // 如果页面打开，也弹 toast
        toast('⏰ 该完成「' + t.name + '」啦！');
      }, delay);
      notificationTimers.push(timer);
    }
  });
}

  const tabsHtml = `

      <div class="memo-tab ${currentMemoCat==='all'?'active':''}" onclick="switchMemoCat('all')">全部 (${memos.length})</div>

function getSearchLink(platform, title) {
  if (platform === 'dy') {
    return 'https://www.douyin.com/search/' + encodeURIComponent(title);
  }
  return 'https://www.xiaohongshu.com/search_result?keyword=' + encodeURIComponent(title);
}

function openTopicLink(platform, title) {
  var appName = platform === 'dy' ? '抖音' : '小红书';
  copyToClipboard(title);
  toast('已复制「' + title.substring(0, 20) + (title.length > 20 ? '...' : '') + '」，请打开' + appName + '粘贴搜索');
}

function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(function() {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  ta.style.top = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
}

function collectHotTopics() {
  const today = todayStr();
  
  const allDy = [...HOT_TOPICS_TEMPLATES.dy];
  const allXhs = [...HOT_TOPICS_TEMPLATES.xhs];
  const allHot = [...HOT_TOPICS_TEMPLATES.hot];
  
  // 随机打乱并选取
  const shuffledDy = allDy.sort(() => Math.random() - 0.5);
  const shuffledXhs = allXhs.sort(() => Math.random() - 0.5);
  const shuffledHot = allHot.sort(() => Math.random() - 0.5);
  
  const pickDy = shuffledDy.slice(0, 5);
  const pickXhs = shuffledXhs.slice(0, 5);
  const pickHot = shuffledHot.slice(0, 4);
  
  const data = {
    date: today,
    collectedAt: nowTimeStr(),
    dy: pickDy.map(t => ({...t, id: uid()})),
    xhs: pickXhs.map(t => ({...t, id: uid()})),
    hot: pickHot.map(t => ({...t, id: uid()}))
  };
  
  Store.set('hot_topics', data);
  Store.set('last_collect_date', today);
  return data;
}

/* ==================== 4. 体重记录 ==================== */
function getWeightRecords() {
  // [{id, date, weight}]
  return Store.get('weight_records', []);
}

function getDinnerRecords() {
  // { '2026-07-28': { status: 'eat'|'noeat', food: 'xxx' } } 或兼容旧格式 'eat'|'noeat'
  const raw = Store.get('dinner_records', {});
  // 兼容旧数据格式
  for (const key in raw) {
    if (typeof raw[key] === 'string') {
      raw[key] = { status: raw[key] };
    }
  }
  return raw;
}

function renderWeight() {
  const records = getWeightRecords().sort((a,b) => a.date.localeCompare(b.date));
  const dinnerRecords = getDinnerRecords();
  
  // 统计
  const today = todayStr();
  const todayRecord = records.find(r => r.date === today);
  const latest = records[records.length - 1];
  const yesterday = records.length >= 2 ? records[records.length - 2] : null;
  const maxW = records.length ? Math.max(...records.map(r => r.weight)) : 0;
  const minW = records.length ? Math.min(...records.map(r => r.weight)) : 0;
  
  let diff = 0, diffText = '—', diffClass = '';
  if (latest && yesterday) {
    diff = (latest.weight - yesterday.weight).toFixed(1);
    diffText = (diff > 0 ? '+' : '') + diff + ' kg';
    diffClass = diff > 0 ? 'up' : diff < 0 ? 'down' : '';
  }
  
  // 本月记录
  const now = new Date();
  const monthPrefix = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const monthRecords = records.filter(r => r.date.startsWith(monthPrefix)).sort((a,b) => b.date.localeCompare(a.date));
  
  // 晚餐记录 - 最近14天
  const dinnerList = [];
  for (let i = 0; i < 14; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    dinnerList.push({ date: ds, day: dayOfWeek(ds), status: dinnerRecords[ds] || null });
  }
  
  // 绘制趋势图
  let chartHtml = '';
  if (records.length >= 2) {
    chartHtml = renderWeightChart(records.slice(-15));
  } else {
    chartHtml = `<div class="empty-state" style="padding:20px"><div class="empty-state-text">记录2条以上体重后显示趋势图</div></div>`;
  }
  
  let tableHtml = '';
  if (monthRecords.length === 0) {
    tableHtml = `<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-text">本月暂无记录</div></div>`;
  } else {
    tableHtml = `
      <table class="weight-table">
        <thead><tr><th>日期</th><th>星期</th><th>体重(kg)</th><th>斤</th><th>变化</th><th></th></tr></thead>
        <tbody>
          ${monthRecords.map((r, idx) => {
            const prev = monthRecords[idx + 1];
            let change = '';
            if (prev) {
              const d = (r.weight - prev.weight).toFixed(1);
              change = d > 0 ? `<span class="stat-trend up">+${d}</span>` : d < 0 ? `<span class="stat-trend down">${d}</span>` : `<span style="color:var(--text-light)">持平</span>`;
            } else {
              change = `<span style="color:var(--text-light)">—</span>`;
            }
            return `<tr>
              <td>${r.date.slice(5)}</td>
              <td style="color:var(--text-light)">${dayOfWeek(r.date)}</td>
              <td><b>${r.weight}</b></td>
              <td style="color:var(--text-sub)">${(r.weight * 2).toFixed(1)}斤</td>
              <td>${change}</td>
              <td><button class="btn-icon btn-danger" style="width:24px;height:24px;font-size:12px" onclick="deleteWeight('${r.id}')">🗑</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    `;
  }
  
  const dinnerHtml = dinnerList.map(d => {
    const rec = dinnerRecords[d.date];
    const status = rec ? rec.status : null;
    const food = rec ? rec.food : '';
    return `
    <div class="dinner-record">
      <div style="flex:1;min-width:0">
        <div class="dinner-date">${d.date.slice(5)} <span class="dinner-day">${d.day}</span></div>
        ${status === 'eat' ? `<div style="font-size:12px;color:var(--text-sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">🍽 ${escapeHtml(food || '未记录')} <a href="javascript:void(0)" onclick="editDinnerFood('${d.date}')" style="color:var(--primary-dark);font-weight:600;margin-left:4px">✏️修改</a></div>` : ''}
        ${status === 'noeat' ? `<div style="font-size:12px;color:var(--success);margin-top:3px">🌿 今晚未进食</div>` : ''}
        ${!status ? `<div style="font-size:12px;color:var(--text-light);margin-top:3px">未记录</div>` : ''}
      </div>
      <div class="dinner-toggle">
        <button class="dinner-btn ${status==='eat'?'active eat':''}" onclick="setDinner('${d.date}','eat')">🍚 食</button>
        <button class="dinner-btn ${status==='noeat'?'active noeat':''}" onclick="setDinner('${d.date}','noeat')">🚫 不食</button>
      </div>
    </div>
  `;}).join('');
  
  return `
    <div class="page-header">
      <div>
        <h1 class="page-title"><span class="page-title-icon">⚖️</span>体重记录</h1>
        <div class="page-desc">坚持记录，看见身体的变化</div>
      </div>
      <button class="btn btn-primary" onclick="showAddWeightModal()">+ 记体重</button>
    </div>
    <div class="page-content">
      <div class="weight-stats">
        <div class="stat-card">
          <div class="stat-label">今日体重</div>
          <div class="stat-value">${latest ? latest.weight : '—'}<span class="unit">kg</span></div>
          <div class="stat-trend ${diffClass}">${diffText}${latest ? ' · ' + (latest.weight * 2).toFixed(1) + '斤' : ''}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">本月最高</div>
          <div class="stat-value">${maxW || '—'}<span class="unit">kg</span></div>
          <div style="font-size:12px;color:var(--text-light)">${maxW ? (maxW * 2).toFixed(1) + '斤' : ''}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">本月最低</div>
          <div class="stat-value">${minW || '—'}<span class="unit">kg</span></div>
          <div style="font-size:12px;color:var(--text-light)">${minW ? (minW * 2).toFixed(1) + '斤' : ''}</div>
        </div>
      </div>
      
      <div class="card">
        <div class="card-title"><span class="card-title-icon">📈</span>体重趋势</div>
        <div class="weight-chart-wrap" style="box-shadow:none;padding:0;margin:0">${chartHtml}</div>
      </div>
      
      <div class="card">
        <div class="card-title"><span class="card-title-icon">📅</span>本月记录表 · ${now.getMonth()+1}月</div>
        ${tableHtml}
      </div>
      
      <div class="card">
        <div class="card-title"><span class="card-title-icon">🍽</span>晚餐食 / 不食</div>
        <div style="font-size:13px;color:var(--text-light);margin-bottom:12px">记录每天晚餐是否进食，方便与次日体重变化对比</div>
        ${dinnerHtml}
      </div>
    </div>
  `;
}

function renderWeightChart(records) {
  const w = 320, h = 160, pad = { l: 30, r: 15, t: 15, b: 25 };
  const cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
  const weights = records.map(r => r.weight);
  const minW = Math.min(...weights) - 0.5;
  const maxW = Math.max(...weights) + 0.5;
  const range = maxW - minW || 1;
  
  const points = records.map((r, i) => {
    const x = pad.l + (records.length === 1 ? cw/2 : (i / (records.length - 1)) * cw);
    const y = pad.t + ch - ((r.weight - minW) / range) * ch;
    return { x, y, ...r };
  });
  
  const pathD = points.map((p, i) => `${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const areaD = pathD + ` L${points[points.length-1].x.toFixed(1)},${pad.t+ch} L${points[0].x.toFixed(1)},${pad.t+ch} Z`;
  
  const yLabels = [minW, (minW+maxW)/2, maxW].map(v => v.toFixed(1));
  
  return `
    <svg class="weight-chart" viewBox="0 0 ${w} ${h}" style="width:100%;max-width:400px;display:block;margin:0 auto">
      <defs>
        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FF9FB5" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#FF9FB5" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${yLabels.map((v, i) => {
        const y = pad.t + (i / 2) * ch;
        return `<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="#F0E4ED" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="${pad.l-5}" y="${y+3}" font-size="9" fill="#B5A8C4" text-anchor="end">${v}</text>`;
      }).join('')}
      <path d="${areaD}" fill="url(#areaGrad)"/>
      <path d="${pathD}" fill="none" stroke="#FF7FA0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${points.map(p => `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#fff" stroke="#FF7FA0" stroke-width="2"/>`).join('')}
      ${points.map((p, i) => {
        if (records.length > 8 && i % 2 !== 0) return '';
        return `<text x="${p.x}" y="${h-8}" font-size="8" fill="#B5A8C4" text-anchor="middle">${p.date.slice(5)}</text>`;
      }).join('')}
    </svg>
  `;
}

function showAddWeightModal() {
  const lastRecord = getWeightRecords().sort((a,b) => b.date.localeCompare(a.date))[0];

function setDinner(date, status) {
  const records = getDinnerRecords();
  const current = records[date] || {};
  // 如果已经选了"食"，再次点"食"时弹出编辑框（不是取消）
  if (status === 'eat' && current.status === 'eat') {
    editDinnerFood(date);
    return;
  }
  // 如果已经选了"不食"，再次点"不食"则取消
  if (status === 'noeat' && current.status === 'noeat') {
    delete records[date];
    Store.set('dinner_records', records);
    renderPage('weight');
    return;
  }
  // 切换为"食"时弹出输入框记录吃了什么
  if (status === 'eat') {
    const prevFood = current.food || '';
    showModal({
      title: '🍚 今晚吃了什么？',
      body: `
        <div class="form-group">
          <label class="form-label">记录晚餐内容</label>
          <textarea class="input" id="dinnerFoodInput" rows="3" placeholder="如：米饭+青菜炒肉+一个苹果" style="resize:none">${escapeHtml(prevFood)}</textarea>
          <div style="font-size:12px;color:var(--text-light);margin-top:6px">方便第二天与体重变化做对比参考</div>
        </div>
      `,
      onConfirm: () => {
        const food = document.getElementById('dinnerFoodInput').value.trim();
        records[date] = { status: 'eat', food: food || '未记录具体内容' };
        Store.set('dinner_records', records);
        renderPage('weight');
        toast('已记录晚餐');
        return true;
      }
    });
    setTimeout(() => { const el = document.getElementById('dinnerFoodInput'); if(el) el.focus(); }, 100);
    return;
  } else {
    records[date] = { status: 'noeat' };
  }
  Store.set('dinner_records', records);
  renderPage('weight');
}

function editDinnerFood(date) {
  const records = getDinnerRecords();
  const current = records[date] || {};
  const prevFood = current.food || '';
  showModal({
    title: '✏️ 修改晚餐内容',
    body: `
      <div class="form-group">

      Store.set('dinner_records', records);
      renderPage('weight');
      toast('已更新晚餐内容');

}

  { id: 'debt_dw_loan', name: '得物借钱', icon: '💸', amount: 0, repayDate: '', type: 'debt', parent: 'software' }

const DEFAULT_DEBT_GROUPS = [
  { id: 'software', name: '软件', icon: '📱', parent: null },
  { id: 'friends', name: '朋友', icon: '👥', parent: null }
];

function getFinanceCats() {
  const stored = Store.get('finance_cats');
  if (!stored) return DEFAULT_FINANCE_CATS;
  return {
    income: stored.income || DEFAULT_FINANCE_CATS.income,
    expense: stored.expense || DEFAULT_FINANCE_CATS.expense,
    extra: stored.extra || DEFAULT_FINANCE_CATS.extra
  };
}

function getFinanceRecords() {
  return Store.get('finance_records', []);
}

function getAssets() { return Store.get('assets', DEFAULT_ASSETS); }
function getAssetGroups() { return Store.get('asset_groups', DEFAULT_ASSET_GROUPS); }
function getDebts() { return Store.get('debts', DEFAULT_DEBTS); }
function getDebtGroups() { return Store.get('debt_groups', DEFAULT_DEBT_GROUPS); }
function getRepayRecords() { return Store.get('repay_records', {}); }

let currentFinanceTab = 'flow'; // 'flow' | 'assets' | 'debts'
let currentFinanceType = 'all';

function renderFinance() {
  if (currentFinanceTab === 'assets') { return renderAssets(); }
  if (currentFinanceTab === 'debts') { return renderDebts(); }
  return renderFlow();
}

function renderFlow() {
  const cats = getFinanceCats();
  const records = getFinanceRecords();
  const now = new Date();
  const monthPrefix = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const monthRecords = records.filter(r => r.date.startsWith(monthPrefix));
  
  const totalIncome = monthRecords.filter(r => r.type === 'income').reduce((s,r) => s + r.amount, 0);
  const totalExpense = monthRecords.filter(r => r.type === 'expense').reduce((s,r) => s + r.amount, 0);
  const totalExtra = monthRecords.filter(r => r.type === 'extra').reduce((s,r) => s + r.amount, 0);
  const balance = totalIncome + totalExtra - totalExpense;

  // 计算总资产和总负债
  const assets = getAssets();
  const debts = getDebts();
  const totalAssets = assets.reduce((s,a) => s + (a.amount||0), 0);
  const totalDebts = debts.reduce((s,d) => s + (d.amount||0), 0);
  const netWorth = totalAssets - totalDebts;
  
  const filtered = currentFinanceType === 'all' ? monthRecords : monthRecords.filter(r => r.type === currentFinanceType);
  const sorted = [...filtered].sort((a,b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
  
  const typeConfig = {
    income: { icon: '💼', cls: 'income', sign: '+', amountCls: 'plus' },
    expense: { icon: '🛍', cls: 'expense', sign: '-', amountCls: 'minus' },
    extra: { icon: '✨', cls: 'extra', sign: '+', amountCls: 'plus' }
  };

  let listHtml = sorted.length === 0
    ? `<div class="empty-state"><div class="empty-state-icon">💸</div><div class="empty-state-text">本月暂无记录</div></div>`
    : sorted.map(r => {
        const cfg = typeConfig[r.type];
        const cat = cats[r.type].find(c => c.id === r.catId);
        return `<div class="finance-item">
          <div class="finance-icon ${cfg.cls}">${cat ? cat.icon : cfg.icon}</div>
          <div class="finance-info">
            <div class="finance-desc">${escapeHtml(r.desc || (cat?cat.name:''))}</div>
            <div class="finance-meta">${cat?cat.name:''} · ${r.date} ${dayOfWeek(r.date)}</div>
          </div>
          <div class="finance-amount ${cfg.amountCls}">${cfg.sign}${r.amount.toFixed(2)}</div>
          <button class="btn-icon btn-danger" style="margin-left:4px" onclick="deleteFinance('${r.id}')">🗑</button>
        </div>`;
      }).join('');

  const catManageHtml = `
    <details style="margin-bottom:16px">
      <summary style="cursor:pointer;font-size:13px;color:var(--text-sub);font-weight:600;padding:8px 0">⚙️ 管理分类（新增/删除）</summary>
      <div style="margin-top:10px">
        ${['income','expense','extra'].map(type => {
          const typeNames = { income: '工资收入', expense: '每日支出', extra: '额外收入' };
          return `<div style="margin-bottom:10px">
            <div style="font-size:12px;color:var(--text-light);margin-bottom:6px">${typeNames[type]}</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px">
              ${cats[type].map(c => `<span class="cat-chip" style="display:inline-flex;align-items:center;gap:4px">${c.icon} ${c.name} <span onclick="deleteFinanceCat('${type}','${c.id}')" style="margin-left:2px;cursor:pointer;color:var(--danger)">✕</span></span>`).join('')}
              <span class="cat-chip" onclick="addFinanceCat('${type}')" style="color:var(--primary-dark)">+ 新增</span>
            </div>
          </div>`;
        }).join('')}
      </div>
    </details>
  `;

  return `
    <div class="page-header">
      <div>
        <h1 class="page-title"><span class="page-title-icon">💰</span>收支明细</h1>
        <div class="page-desc">${now.getMonth()+1}月收支一览</div>
      </div>
      <button class="btn btn-primary" onclick="showAddFinanceModal()">+ 记一笔</button>
    </div>
    <div class="page-content">
      <div class="finance-main-tabs">
        <div class="finance-main-tab ${currentFinanceTab==='flow'?'active':''}" onclick="switchFinanceMainTab('flow')">📋 流水</div>
        <div class="finance-main-tab ${currentFinanceTab==='assets'?'active':''}" onclick="switchFinanceMainTab('assets')">🏦 总资产 <span style="font-size:11px;opacity:.8">${totalAssets.toFixed(0)}</span></div>
        <div class="finance-main-tab ${currentFinanceTab==='debts'?'active':''}" onclick="switchFinanceMainTab('debts')">💳 总负债 <span style="font-size:11px;opacity:.8">${totalDebts.toFixed(0)}</span></div>
      </div>
      <div class="finance-summary">
        <div class="summary-card income"><div class="summary-label">工资收入</div><div class="summary-amount">${totalIncome.toFixed(2)}<span class="unit">元</span></div><div class="summary-icon">💼</div></div>
        <div class="summary-card expense"><div class="summary-label">每日支出</div><div class="summary-amount">${totalExpense.toFixed(2)}<span class="unit">元</span></div><div class="summary-icon">🛍</div></div>
        <div class="summary-card extra"><div class="summary-label">额外收入</div><div class="summary-amount">${totalExtra.toFixed(2)}<span class="unit">元</span></div><div class="summary-icon">✨</div></div>
      </div>
      <div class="card" style="display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#FFF5F7,#F0EAFF)">
        <div>
          <div style="font-size:13px;color:var(--text-sub)">本月结余 · 净资产 ${netWorth>=0?'+':''}${netWorth.toFixed(0)}</div>
          <div style="font-size:24px;font-weight:700;color:${balance>=0?'var(--success)':'var(--danger)'}">${balance>=0?'+':''}${balance.toFixed(2)} <span style="font-size:14px;font-weight:400">元</span></div>
        </div>
        <div style="font-size:36px">${balance>=0?'😊':'😅'}</div>
      </div>
      ${catManageHtml}
      <div class="finance-tabs">
        <div class="finance-tab ${currentFinanceType==='all'?'active':''}" onclick="switchFinanceType('all')">全部 (${monthRecords.length})</div>
        <div class="finance-tab ${currentFinanceType==='income'?'active':''}" onclick="switchFinanceType('income')">💰 工资收入</div>
        <div class="finance-tab ${currentFinanceType==='expense'?'active':''}" onclick="switchFinanceType('expense')">🛍 每日支出</div>
        <div class="finance-tab ${currentFinanceType==='extra'?'active':''}" onclick="switchFinanceType('extra')">✨ 额外收入</div>
      </div>
      ${listHtml}
    </div>
  `;
}

// ===== 资产页面 =====
function renderAssets() {
  const assets = getAssets();
  const groups = getAssetGroups();
  const now = new Date();
  const totalAssets = assets.reduce((s,a) => s + (a.amount||0), 0);

  // 无分组项
  const ungrouped = assets.filter(a => !a.parent);
  // 分组项
  const groupedHtml = groups.map(g => {
    const items = assets.filter(a => a.parent === g.id);
    const gTotal = items.reduce((s,i) => s + (i.amount||0), 0);
    return { g, items, gTotal };
  });

  const assetItemHtml = (a) => `
    <div class="finance-item">
      <div class="finance-icon income">${a.icon||'💰'}</div>
      <div class="finance-info">
        <div class="finance-desc">${escapeHtml(a.name)}</div>
      </div>
      <div class="finance-amount plus" style="cursor:pointer" onclick="editAssetAmount('${a.id}')">${(a.amount||0).toFixed(2)}</div>
      <button class="btn-icon btn-danger" style="margin-left:4px" onclick="deleteAsset('${a.id}')">🗑</button>
    </div>`;

  return `
    <div class="page-header">
      <div>
        <h1 class="page-title"><span class="page-title-icon">🏦</span>总资产</h1>
        <div class="page-desc">资产总额 ${totalAssets.toFixed(2)} 元</div>
      </div>
      <button class="btn btn-primary" onclick="showAddAssetModal()">+ 添加资产</button>
    </div>
    <div class="page-content">
      <div class="finance-main-tabs">
        <div class="finance-main-tab" onclick="switchFinanceMainTab('flow')">📋 流水</div>
        <div class="finance-main-tab active">🏦 总资产 <span style="font-size:11px;opacity:.8">${totalAssets.toFixed(0)}</span></div>
        <div class="finance-main-tab" onclick="switchFinanceMainTab('debts')">💳 总负债</div>
      </div>
      <div class="card" style="background:linear-gradient(135deg,#e8f8e8,#d4f0d4);text-align:center;padding:20px">
        <div style="font-size:13px;color:var(--success)">💰 总资产</div>
        <div style="font-size:32px;font-weight:700;color:var(--success)">${totalAssets.toFixed(2)}<span style="font-size:16px;font-weight:400"> 元</span></div>
      </div>
      ${ungrouped.map(assetItemHtml).join('')}
      ${groupedHtml.map(g => `
        <div class="card" style="margin-top:16px">
          <div class="card-title"><span class="card-title-icon">${g.g.icon}</span>${g.g.name} <span style="font-size:13px;color:var(--success);margin-left:auto">${g.gTotal.toFixed(2)}</span></div>
          ${g.items.map(assetItemHtml).join('')}
          <button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="showAddAssetModal('${g.id}')">+ 添加${g.g.name}账户</button>
        </div>
      `).join('')}
      ${assets.length === 0 ? '<div class="empty-state"><div class="empty-state-icon">🏦</div><div class="empty-state-text">暂无资产记录</div></div>' : ''}
    </div>
  `;
}

// ===== 负债页面 =====
function renderDebts() {
  const debts = getDebts();
  const groups = getDebtGroups();
  const repayRecords = getRepayRecords();
  const now = new Date();
  const monthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const monthRepaid = repayRecords[monthKey] || [];
  
  const totalDebts = debts.reduce((s,d) => s + (d.amount||0), 0);

  // 计算还款进度
  const debtTotal = debts.length;
  const debtPaid = debts.filter(d => monthRepaid.includes(d.id)).length;
  const debtPercent = debtTotal > 0 ? Math.round(debtPaid / debtTotal * 100) : 0;

  const groupedHtml = groups.map(g => {
    const items = debts.filter(d => d.parent === g.id);
    const gTotal = items.reduce((s,i) => s + (i.amount||0), 0);
    return { g, items, gTotal };
  });

  const debtItemHtml = (d) => {
    const isPaid = monthRepaid.includes(d.id);
    const repayDateStr = d.repayDate ? `还款日: 每月${d.repayDate}号` : '';
    return `
    <div class="finance-item" style="${isPaid?'background:rgba(107,203,119,.08)':''}">
      <div class="checkin-checkbox ${isPaid?'checked':''}" onclick="toggleRepay('${d.id}')" style="flex-shrink:0">${isPaid?'✓':''}</div>
      <div class="finance-icon expense">${d.icon||'💳'}</div>
      <div class="finance-info">
        <div class="finance-desc">${escapeHtml(d.name)}</div>
        <div class="finance-meta">${repayDateStr}</div>
      </div>
      <div class="finance-amount minus" style="cursor:pointer" onclick="editDebtAmount('${d.id}')">${(d.amount||0).toFixed(2)}</div>
      <button class="btn-icon" style="margin-left:2px" onclick="editDebtRepayDate('${d.id}')" title="还款日">📅</button>
      <button class="btn-icon btn-danger" style="margin-left:2px" onclick="deleteDebt('${d.id}')">🗑</button>
    </div>`;
  };

  return `
    <div class="page-header">
      <div>
        <h1 class="page-title"><span class="page-title-icon">💳</span>总负债</h1>
        <div class="page-desc">负债总额 ${totalDebts.toFixed(2)} 元 · ${now.getMonth()+1}月还款 ${debtPaid}/${debtTotal}</div>
      </div>
      <button class="btn btn-primary" onclick="showAddDebtModal()">+ 添加负债</button>
    </div>
    <div class="page-content">
      <div class="finance-main-tabs">
        <div class="finance-main-tab" onclick="switchFinanceMainTab('flow')">📋 流水</div>
        <div class="finance-main-tab" onclick="switchFinanceMainTab('assets')">🏦 总资产</div>
        <div class="finance-main-tab active">💳 总负债 <span style="font-size:11px;opacity:.8">${totalDebts.toFixed(0)}</span></div>
      </div>
      <div class="checkin-progress" style="margin-bottom:14px">
        <div class="progress-info-full">
          <div class="progress-bar-header">
            <h3>${now.getMonth()+1}月还款 ${debtPaid}/${debtTotal}</h3>
            <span class="progress-percent-text">${debtPercent}%</span>
          </div>
          <div class="progress-bar-track">
            <div class="progress-bar-fill" style="width:${debtPercent}%;background:linear-gradient(90deg,#FF8C94,#FF9FB5)"></div>
          </div>
          <p>${debtPercent===100?'🎉 本月全部还清！' : debtPercent>=50?'💪 已完成过半' : '📌 记得按时还款哦'}</p>
          <div class="progress-date">总额 ${totalDebts.toFixed(2)} 元</div>
        </div>
      </div>
      <div class="card" style="background:linear-gradient(135deg,#fff0f0,#ffe8e8);text-align:center;padding:20px">
        <div style="font-size:13px;color:var(--danger)">💸 总负债</div>
        <div style="font-size:32px;font-weight:700;color:var(--danger)">${totalDebts.toFixed(2)}<span style="font-size:16px;font-weight:400"> 元</span></div>
      </div>
      ${groupedHtml.map(g => `
        <div class="card" style="margin-top:16px">
          <div class="card-title"><span class="card-title-icon">${g.g.icon}</span>${g.g.name} <span style="font-size:13px;color:var(--danger);margin-left:auto">${g.gTotal.toFixed(2)}</span></div>
          ${g.items.map(debtItemHtml).join('')}
          <button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="showAddDebtModal('${g.id}')">+ 添加${g.g.name}负债</button>
        </div>
      `).join('')}
      ${debts.length === 0 ? '<div class="empty-state"><div class="empty-state-icon">💳</div><div class="empty-state-text">暂无负债记录</div></div>' : ''}
    </div>
  `;
}

function renderPodcast() {
  const today = todayStr();
  
  // 随机选一个"今日推荐"
  var storedFeatured = Store.get('podcast_featured', {});
  var seed;
  if (storedFeatured.date === today) {
    seed = storedFeatured.idx;
  } else {
    seed = Math.floor(Math.random() * PODCAST_LIST.length);
    Store.set('podcast_featured', { date: today, idx: seed });
  }
  const featured = PODCAST_LIST[seed];
  
  // 获取显示的播客列表（默认6个，刷新时随机）
  var displayed = Store.get('podcast_displayed', {});
  var podcastList;
  if (displayed.date === today && displayed.items) {
    podcastList = displayed.items.map(id => PODCAST_LIST.find(p => p.id === id)).filter(Boolean);
  }
  if (!podcastList || podcastList.length < 6) {
    podcastList = PODCAST_LIST.slice().sort(() => Math.random() - 0.5).slice(0, 6);
    Store.set('podcast_displayed', { date: today, items: podcastList.map(p => p.id) });
  }
  
  const podcastCards = podcastList.map(p => `
    <div class="podcast-card" onclick="openPodcast('${p.url}')">
      <div class="podcast-icon">${p.icon}</div>
      <div class="podcast-info">

        <span class="podcast-cat">${escapeHtml(p.category)}</span>
      </div>
      <div class="podcast-play">▶</div>
    </div>
  `).join('');
  
  return `
    <div class="page-header">
      <div>
        <h1 class="page-title"><span class="page-title-icon">🎧</span>播客</h1>
        <div class="page-desc">每天听一点，悄悄变优秀</div>

    </div>

      <!-- 今日推荐 -->
      <div class="podcast-featured" onclick="openPodcast('${featured.url}')">
        <div class="podcast-featured-badge">🌟 今日推荐</div>
        <div class="podcast-featured-icon">${featured.icon}</div>
        <div class="podcast-featured-title">${escapeHtml(featured.title)}</div>
        <div class="podcast-featured-author">${escapeHtml(featured.author)}</div>
        <div class="podcast-featured-desc">${escapeHtml(featured.desc)}</div>
        <button class="btn btn-primary" style="margin-top:10px">▶ 开始收听</button>
      </div>
      
      <!-- 播客列表 -->
      <div class="section-header" style="margin-top:20px">
        <div class="section-title">🎙️ 精选播客</div>
        <div style="font-size:12px;color:var(--text-light)">点击跳转小宇宙App收听</div>
      </div>

        如未安装小宇宙，可在App Store搜索下载

    </div>
  `;

function getKnowledge() {
  return Store.get('knowledge', {});
}

function getTodayKnowledge() {
  const today = todayStr();
  const saved = getKnowledge();
  if (saved.date === today && saved.items) return saved.items;
  
  // 基于日期种子选取5条
  const seed = parseInt(today.split('-').join(''));
  const picked = [];
  const used = new Set();
  for (let i = 0; i < 5; i++) {
    const idx = (seed + i * 13 + i * i * 7) % KNOWLEDGE_BANK.length;
    if (!used.has(idx)) {
      picked.push(KNOWLEDGE_BANK[idx]);
      used.add(idx);
    }
  }
  // 如果不够5条，补足
  for (let i = 0; picked.length < 5 && i < KNOWLEDGE_BANK.length; i++) {
    if (!used.has(i)) { picked.push(KNOWLEDGE_BANK[i]); used.add(i); }
  }
  
  Store.set('knowledge', { date: today, items: picked });
  return picked;
}

function renderKnowledge() {
  const items = getTodayKnowledge();
  const today = todayStr();
  
  const cards = items.map((k, idx) => `
    <div class="knowledge-card">
      <div class="knowledge-num">${idx + 1}</div>
      <div class="knowledge-content">
        <div class="knowledge-text">${escapeHtml(k.text)}</div>
        <span class="knowledge-cat">${k.icon} ${escapeHtml(k.cat)}</span>
      </div>
    </div>
  `).join('');
  
  return `
    <div class="page-header">
      <div>
        <h1 class="page-title"><span class="page-title-icon">📖</span>每日常识</h1>
        <div class="page-desc">每天学一点，悄悄变博学</div>

// 计算母亲节（5月第二个星期日）
function getMothersDay(year) {
  const d = new Date(year, 4, 1);
  const dow = d.getDay();
  const secondSun = 1 + ((7 - dow) % 7) + 7;
  return `${year}-05-${String(secondSun).padStart(2,'0')}`;
}
// 计算父亲节（6月第三个星期日）
function getFathersDay(year) {
  const d = new Date(year, 5, 1);
  const dow = d.getDay();
  const thirdSun = 1 + ((7 - dow) % 7) + 14;
  return `${year}-06-${String(thirdSun).padStart(2,'0')}`;
}
// 计算感恩节（11月第四个星期四）
function getThanksgiving(year) {
  const d = new Date(year, 10, 1);
  const dow = d.getDay();
  const fourthThu = 1 + ((4 - dow + 7) % 7) + 21;
  return `${year}-11-${String(fourthThu).padStart(2,'0')}`;
}

    2026: { chunjie: '2026-02-17', duanwu: '2026-06-19', zhongqiu: '2026-09-25' },
    2027: { chunjie: '2027-02-06', duanwu: '2027-06-09', zhongqiu: '2027-09-15' },

    2030: { chunjie: '2030-02-03', duanwu: '2030-06-05', zhongqiu: '2030-09-12' }
  };
  return lunarMap[year] || lunarMap[2026];
}

  const year = now.getFullYear();
  
  // 分组：已过、今天、未来
  const past = [], upcoming = [];
  let todayList = [];
  all.forEach(h => {
    if (h.date === today) todayList.push(h);
    else if (h.date < today) past.push(h);
    else upcoming.push(h);
  });
  
  // 最近的5个
  const next5 = upcoming.slice(0, 5);
  // 今天的
  const todayHtml = todayList.length > 0 ? `
    <div class="card" style="background:linear-gradient(135deg,#FFF5F7,#F8EEFF);margin-bottom:16px">
      <div class="card-title"><span class="card-title-icon">🎉</span>今天 · ${today} ${dayOfWeek(today)}</div>
      ${todayList.map(h => `<div class="holiday-item today"><span class="holiday-icon">${h.icon}</span><span class="holiday-name">${escapeHtml(h.name)}</span>${h.type==='birthday'?'<span class="holiday-badge">🎂生日</span>':''}</div>`).join('')}
    </div>
  ` : '';
  
  // 即将到来
  const upcomingHtml = `
    <div class="card" style="margin-bottom:16px">
      <div class="card-title"><span class="card-title-icon">📅</span>即将到来</div>
      ${next5.length === 0 ? '<div class="empty-state"><div class="empty-state-text">今年暂无更多节日</div></div>' : ''}
      ${next5.map(h => {
        const daysLeft = Math.ceil((new Date(h.date) - now) / 86400000);
        return `<div class="holiday-item">
          <span class="holiday-icon">${h.icon}</span>
          <div style="flex:1;min-width:0">
            <div class="holiday-name">${escapeHtml(h.name)} ${h.type==='birthday'?'<span class="holiday-badge">🎂生日</span>':''}</div>
            <div class="holiday-date">${h.date} · ${dayOfWeek(h.date)} · 还有 ${daysLeft} 天</div>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
  
  // 所有节日列表
  const allHtml = `
    <div class="card">
      <div class="card-title"><span class="card-title-icon">📋</span>${year}年全部节日</div>
      <div style="max-height:400px;overflow-y:auto">
        ${all.map(h => `
          <div class="holiday-item ${h.date===today?'today':''} ${h.date<today?'past':''}">
            <span class="holiday-icon">${h.icon}</span>
            <div style="flex:1;min-width:0">
              <div class="holiday-name">${escapeHtml(h.name)} ${h.type==='birthday'?'<span class="holiday-badge">🎂生日</span>':h.type==='festival'?'<span class="holiday-badge" style="background:#FFF0F5;color:#FF7FA0">节假日</span>':''}</div>
              <div class="holiday-date">${h.date} · ${dayOfWeek(h.date)} ${h.date===today?'· 🎉 今天！':h.date<today?'· ✅ 已过':''}</div>
            </div>
            ${h.type === 'birthday' ? `<button class="btn-icon btn-danger" onclick="deleteCustomHoliday('${h.id}')">🗑</button>` : ''}
          </div>
        `).join('')}
      </div>
    </div>
  `;
  
  return `
    <div class="page-header">
      <div>
        <h1 class="page-title"><span class="page-title-icon">🎂</span>节日生日</h1>
        <div class="page-desc">记住每一个重要的日子</div>
      </div>
      <button class="btn btn-primary" onclick="showAddHolidayModal()">+ 添加生日</button>
    </div>
    <div class="page-content">
      ${todayHtml}
      ${upcomingHtml}
      ${allHtml}
      <div style="text-align:center;margin-top:16px;font-size:12px;color:var(--text-light)">
        💡 节假日自动更新 · 生日可自定义添加
      </div>
    </div>
  `;
}

function toggleRepay(debtId) {
  const now = new Date();
  const monthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const records = getRepayRecords();
  if (!records[monthKey]) records[monthKey] = [];
  const idx = records[monthKey].indexOf(debtId);
  if (idx >= 0) {
    records[monthKey].splice(idx, 1);
  } else {
    records[monthKey].push(debtId);
  }
  Store.set('repay_records', records);
  document.getElementById('main').innerHTML = renderFinance();
}

function showModal({ title, body, onConfirm, confirmText = '确定', cancelText = '取消' }) {

  modal.innerHTML = `

    <div class="modal-body">${body}</div>

      <button class="btn btn-primary" id="modalConfirmBtn" style="flex:1;padding:12px">${confirmText}</button>
    </div>
  `;
  overlay.classList.add('show');
  
  document.getElementById('modalConfirmBtn').onclick = () => {
    const result = onConfirm && onConfirm();
    if (result !== false) closeModal();
  };
}

let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  // 显示安装横幅
  setTimeout(() => {
    if (deferredPrompt && !Store.get('install_dismissed', false)) {
      document.getElementById('installBanner').classList.add('show');
    }
  }, 2000);
});

window.addEventListener('appinstalled', () => {
  document.getElementById('installBanner').classList.remove('show');
  deferredPrompt = null;
  toast('已安装，可在桌面找到图标');
});

function triggerInstall() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      document.getElementById('installBanner').classList.remove('show');
    });
  } else {
    // iOS 不支持 beforeinstallprompt，显示指引
    showInstallGuide();
  }
}

/* ==================== 数据备份/恢复（隐藏功能） ==================== */
function exportData() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith(STORAGE_PREFIX)) {
      data[key] = localStorage.getItem(key);
    }
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `海绵饱饱_备份_${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('备份文件已下载');
}

/* ==================== 头像更换 ==================== */
let avatarData = Store.get('avatar', 'emoji:🧽');

function updateLogoDisplay() {
  const logo = document.getElementById('sidebarLogo');
  const mobileLogo = document.getElementById('mobileLogo');
  
  const applyToEl = (el) => {
    if (!el) return;
    if (avatarData.startsWith('img:')) {
      el.style.backgroundImage = `url(${avatarData.slice(4)})`;
      el.style.backgroundSize = 'cover';
      el.innerHTML = '<span class="logo-overlay">更换</span>';
    } else {
      el.style.backgroundImage = '';
      const emoji = avatarData.startsWith('emoji:') ? avatarData.slice(6) : avatarData;
      el.innerHTML = emoji + (el === logo ? '<span class="logo-overlay">更换</span>' : '');
    }
  };
  
  applyToEl(logo);
  applyToEl(mobileLogo);
  
  // 动态更新桌面图标
  updateDesktopIcon();
}

/* ==================== 动态桌面图标 ==================== */
function updateDesktopIcon() {
  const canvas = document.createElement('canvas');
  canvas.width = 192;
  canvas.height = 192;
  const ctx = canvas.getContext('2d');
  
  // 渐变背景
  const grad = ctx.createLinearGradient(0, 0, 192, 192);
  grad.addColorStop(0, '#FF9FB5');
  grad.addColorStop(1, '#B5A8FF');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(0, 0, 192, 192, 36);
  ctx.fill();
  
  // 绘制头像内容
  if (avatarData.startsWith('img:')) {
    const img = new Image();
    img.onload = function() {
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(16, 16, 160, 160, 30);
      ctx.clip();
      ctx.drawImage(img, 16, 16, 160, 160);
      ctx.restore();
      applyIconDataUrl(canvas.toDataURL('image/png'));
    };
    img.src = avatarData.slice(4);
    return;
  } else {
    const emoji = avatarData.startsWith('emoji:') ? avatarData.slice(6) : avatarData;
    ctx.font = '90px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emoji, 96, 104);
    applyIconDataUrl(canvas.toDataURL('image/png'));
  }
}

function applyIconDataUrl(dataUrl) {
  const favicon = document.getElementById('faviconLink');
  const appleIcon = document.getElementById('appleIconLink');
  if (favicon) favicon.href = dataUrl;
  if (appleIcon) appleIcon.href = dataUrl;
}

function changeLogo() {
  const emojiOptions = ['🧽','🌸','🦋','⭐','🍀','🌈','💖','🐱','🐰','🦊','🐼','🍓','🍑','🎀','✨','🌙','🔥','💎','🎵','🍩'];
  let emojiGrid = emojiOptions.map(e => {
    const isActive = avatarData === 'emoji:' + e;
    return `<button onclick="setEmojiAvatar('${e}')" style="width:44px;height:44px;border-radius:10px;font-size:24px;display:flex;align-items:center;justify-content:center;background:${isActive?'var(--primary-light)':'var(--bg-main)'};transition:all .2s;cursor:pointer;border:2px solid ${isActive?'var(--primary)':'transparent'}">${e}</button>`;
  }).join('');
  
  showModal({
    title: '🎨 更换头像',
    body: `
      <div style="font-size:13px;color:var(--text-sub);margin-bottom:12px">点击下方 emoji 或上传图片</div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px">${emojiGrid}</div>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">
        <input type="file" id="avatarFileInput" accept="image/*" style="display:none" onchange="uploadAvatar(event)">
        <button class="btn btn-ghost" style="flex:1;padding:12px" onclick="document.getElementById('avatarFileInput').click()">📷 从相册选择</button>
        ${avatarData.startsWith('img:') ? '<button class="btn btn-danger" style="flex:1;padding:12px" onclick="removeAvatarImage()">🗑 恢复默认</button>' : ''}
      </div>
      <div style="padding:10px;background:#FFF9E6;border-radius:10px;font-size:12px;color:#B8860B;line-height:1.6">
        📱 <b>修改桌面图标：</b>换好头像后 → 长按桌面图标删除 → Safari打开链接 → 分享 → 添加到主屏幕
      </div>
    `,
    onConfirm: () => true
  });
}

function setEmojiAvatar(emoji) {
  avatarData = 'emoji:' + emoji;
  Store.set('avatar', avatarData);
  updateLogoDisplay();
  closeModal();
  toast('头像已更新 ✨');
}

function uploadAvatar(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    avatarData = 'img:' + e.target.result;
    Store.set('avatar', avatarData);
    updateLogoDisplay();
    closeModal();
    toast('头像已更新 📷');
  };
  reader.readAsDataURL(file);
}

function removeAvatarImage() {
  avatarData = 'emoji:🧽';
  Store.set('avatar', avatarData);
  updateLogoDisplay();
  closeModal();
  toast('已恢复默认头像');
}

// 启动
document.addEventListener('DOMContentLoaded', init);
if (document.readyState !== 'loading') init();

// 手动强制刷新
function forceRefresh() {
  if (window.caches) {
    caches.keys().then(function(names) {
      for (var i = 0; i < names.length; i++) caches.delete(names[i]);
    }).then(function() {
      window.location.reload(true);
    });
  } else {
    window.location.reload(true);
  }
}

// 防止双击缩放
let lastTouch = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouch <= 300) e.preventDefault();
  lastTouch = now;
}, { passive: false });

// 监听键盘回车提交
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && document.getElementById('modalOverlay').classList.contains('show')) {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'textarea') {
      document.getElementById('modalConfirmBtn')?.click();
    }
  }
});
</script>
</body>
</html>
