<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="海绵饱饱">
<meta name="theme-color" content="#FFB6C1">
<title>海绵饱饱</title>
<style>
/* ==================== 全局变量与重置 ==================== */
:root {
  --primary: #FF9FB5;
  --primary-dark: #FF7FA0;
  --primary-light: #FFD4DD;
  --primary-bg: #FFF5F7;
  --secondary: #B5A8FF;
  --accent: #8FE3D0;
  --warning: #FFD166;
  --danger: #FF8C94;
  --success: #6BCB77;
  --text-main: #3D2C4A;
  --text-sub: #8A7A99;
  --text-light: #B5A8C4;
  --bg-main: #FAF6F9;
  --bg-card: #FFFFFF;
  --bg-hover: #F5EDF2;
  --border: #F0E4ED;
  --shadow: 0 2px 12px rgba(180, 130, 160, 0.08);
  --shadow-hover: 0 4px 20px rgba(180, 130, 160, 0.15);
  --radius: 14px;
  --radius-sm: 10px;
  --sidebar-w: 200px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  color: var(--text-main);
  background: var(--bg-main);
  -webkit-font-smoothing: antialiased;
}

input, button, textarea, select {
  font-family: inherit;
  font-size: inherit;
  outline: none;
  border: none;
  background: none;
  color: inherit;
}

button { cursor: pointer; }

/* ==================== 布局 ==================== */
.app {
  display: flex;
  height: 100vh;
  height: 100dvh;
  width: 100vw;
}

/* ==================== 侧边栏 ==================== */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: linear-gradient(180deg, #FFF0F4 0%, #F8EAF0 100%);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  z-index: 100;
}

.sidebar-header {
  padding: 20px 16px 16px;
  border-bottom: 1px solid rgba(255, 159, 181, 0.15);
  display: flex;
  align-items: center;
  gap: 10px;
}

.sidebar-logo {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(255, 159, 181, 0.4);
}

.sidebar-title-wrap {
  flex: 1;
  min-width: 0;
}

.sidebar-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}

.sidebar-subtitle {
  font-size: 11px;
  color: var(--text-light);
  margin-top: 2px;
}

.sidebar-edit-btn {
  width: 24px;
  height: 24px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-light);
  font-size: 13px;
  flex-shrink: 0;
  transition: all .2s;
}
.sidebar-edit-btn:active { background: rgba(255,159,181,.2); color: var(--primary-dark); }

.nav-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px 10px;
  list-style: none;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all .2s ease;
  margin-bottom: 4px;
  color: var(--text-sub);
  font-weight: 500;
  position: relative;
}

.nav-item:hover { background: rgba(255, 159, 181, 0.1); }

.nav-item.active {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  box-shadow: 0 3px 10px rgba(255, 127, 160, 0.35);
}

.nav-icon {
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.nav-label { font-size: 14px; flex: 1; }

.sidebar-footer {
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0));
  border-top: 1px solid rgba(255, 159, 181, 0.15);
  font-size: 11px;
  color: var(--text-light);
  text-align: center;
}

/* 汉堡菜单按钮 - 移动端 */
.menu-toggle {
  display: none;
  position: fixed;
  top: calc(12px + env(safe-area-inset-top, 0));
  left: 12px;
  z-index: 200;
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: var(--bg-card);
  box-shadow: var(--shadow);
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: var(--primary-dark);
}

.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.35);
  z-index: 99;
  opacity: 0;
  transition: opacity .3s;
}

/* ==================== 主内容区 ==================== */
.main {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  position: relative;
}

.page-header {
  padding: 20px 24px 16px;
  position: sticky;
  top: 0;
  background: linear-gradient(180deg, var(--bg-main) 85%, rgba(250,246,249,0));
  z-index: 10;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.page-title {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
}

.page-title-icon { font-size: 22px; }

.page-desc {
  font-size: 13px;
  color: var(--text-light);
  margin-top: 4px;
  font-weight: 400;
}

.page-content {
  padding: 0 24px 40px;
}

/* ==================== 通用组件 ==================== */
.card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}

.card-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-main);
}

.card-title-icon { font-size: 18px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  transition: all .2s;
  white-space: nowrap;
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  box-shadow: 0 2px 8px rgba(255, 127, 160, 0.3);
}
.btn-primary:active { transform: scale(.97); }

.btn-ghost {
  background: var(--primary-bg);
  color: var(--primary-dark);
}
.btn-ghost:active { background: var(--primary-light); }

.btn-icon {
  width: 34px;
  height: 34px;
  padding: 0;
  border-radius: 10px;
  background: var(--primary-bg);
  color: var(--primary-dark);
  font-size: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.btn-icon:active { background: var(--primary-light); }

.btn-danger {
  color: var(--danger);
  background: rgba(255, 140, 148, 0.1);
}
.btn-danger:active { background: rgba(255,140,148,.2); }

.input {
  width: 100%;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  background: var(--bg-main);
  border: 1.5px solid transparent;
  transition: all .2s;
  font-size: 14px;
}
.input:focus { border-color: var(--primary); background: #fff; }

.input-group {
  display: flex;
  gap: 8px;
  align-items: center;
}

.tag {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}
.tag-pink { background: var(--primary-bg); color: var(--primary-dark); }
.tag-purple { background: rgba(181,168,255,.15); color: #7A6AD9; }
.tag-green { background: rgba(143,227,208,.2); color: #4FA897; }
.tag-orange { background: rgba(255,209,102,.2); color: #C99A2E; }
.tag-red { background: rgba(255,140,148,.15); color: var(--danger); }
.tag-blue { background: rgba(130,170,255,.15); color: #5A7ACC; }

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-light);
}
.empty-state-icon { font-size: 40px; margin-bottom: 10px; opacity: .6; }
.empty-state-text { font-size: 14px; }

/* ==================== 学习内容推荐卡片 ==================== */
.learn-section { margin-bottom: 18px; }

.learn-subtitle {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 12px;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 6px;
}

.learn-cards {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.learn-card {
  background: var(--bg-main);
  border-radius: var(--radius-sm);
  padding: 14px;
  border-left: 3px solid var(--primary);
  transition: all .2s;
}

.learn-card:hover { background: var(--bg-hover); transform: translateX(2px); }

.learn-platform {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 5px;
  margin-bottom: 6px;
  letter-spacing: .5px;
}

.learn-platform.bilibili { background: #FB7299; color: #fff; }
.learn-platform.douyin { background: #111; color: #fff; }

.learn-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-main);
  margin-bottom: 4px;
}

.learn-desc {
  font-size: 12px;
  color: var(--text-sub);
  line-height: 1.5;
  margin-bottom: 8px;
}

.learn-link {
  font-size: 12px;
  color: var(--primary-dark);
  text-decoration: none;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all .2s;
}

.learn-link:active { opacity: .7; }

.learn-tip {
  margin-top: 8px;
  padding: 12px;
  background: linear-gradient(135deg, #FFF5F7, #F0EAFF);
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-sub);
  line-height: 1.6;
}

@media (min-width: 600px) {
  .learn-cards { grid-template-columns: repeat(3, 1fr); }
}

/* ==================== 每日打卡 ==================== */
.checkin-progress {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 18px;
  background: linear-gradient(135deg, #FFF5F7, #F8EEFF);
  padding: 18px;
  border-radius: var(--radius);
}

.progress-ring-wrap {
  position: relative;
  width: 70px;
  height: 70px;
  flex-shrink: 0;
}

.progress-ring {
  width: 70px;
  height: 70px;
  transform: rotate(-90deg);
}

.progress-ring-bg {
  fill: none;
  stroke: rgba(255,159,181,.2);
  stroke-width: 7;
}

.progress-ring-fill {
  fill: none;
  stroke: url(#progressGrad);
  stroke-width: 7;
  stroke-linecap: round;
  transition: stroke-dashoffset .5s ease;
}

.progress-percent {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  color: var(--primary-dark);
}

.progress-info { flex: 1; }
.progress-info h3 { font-size: 15px; margin-bottom: 4px; }
.progress-info p { font-size: 13px; color: var(--text-sub); }
.progress-date { font-size: 12px; color: var(--text-light); margin-top: 2px; }

.checkin-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 12px;
  border-radius: var(--radius-sm);
  background: var(--bg-main);
  margin-bottom: 8px;
  transition: all .25s;
}

.checkin-item.done {
  background: rgba(107, 203, 119, 0.08);
}

.checkin-checkbox {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2.5px solid var(--primary-light);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  cursor: pointer;
  transition: all .25s;
  color: #fff;
  font-size: 14px;
}

.checkin-checkbox.checked {
  background: linear-gradient(135deg, var(--success), #4FA859);
  border-color: var(--success);
}

.checkin-content {
  flex: 1;
  min-width: 0;
}

.checkin-name {
  font-size: 15px;
  font-weight: 500;
  color: var(--text-main);
  transition: all .25s;
}

.checkin-item.done .checkin-name {
  text-decoration: line-through;
  color: var(--text-light);
}

.checkin-time {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 2px;
}

.checkin-delete {
  opacity: 0;
  transition: opacity .2s;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--danger);
  font-size: 14px;
  flex-shrink: 0;
}

.checkin-item:hover .checkin-delete { opacity: 1; }

/* ==================== 备忘录 ==================== */
.memo-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.memo-tab {
  padding: 7px 16px;
  border-radius: 20px;
  background: var(--bg-card);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-sub);
  box-shadow: var(--shadow);
  transition: all .2s;
  display: flex;
  align-items: center;
  gap: 5px;
}

.memo-tab.active {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
}

.memo-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px;
  border-radius: var(--radius-sm);
  background: var(--bg-main);
  margin-bottom: 8px;
  transition: all .2s;
}

.memo-item:hover { background: var(--bg-hover); }

.memo-checkbox {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  border: 2px solid var(--primary-light);
  flex-shrink: 0;
  margin-top: 1px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 12px;
  transition: all .2s;
}

.memo-checkbox.checked {
  background: var(--primary);
  border-color: var(--primary);
}

.memo-content { flex: 1; min-width: 0; }
.memo-text {
  font-size: 15px;
  word-break: break-all;
}
.memo-item.done .memo-text {
  text-decoration: line-through;
  color: var(--text-light);
}
.memo-meta {
  font-size: 11px;
  color: var(--text-light);
  margin-top: 4px;
}

.memo-actions {
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity .2s;
}
.memo-item:hover .memo-actions { opacity: 1; }

/* ==================== 选题灵感 ==================== */
.inspiration-section { margin-bottom: 24px; }

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  gap: 10px;
}

.section-title {
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}

.hot-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
  margin-bottom: 10px;
  border-left: 3px solid var(--primary);
}

.hot-card.dy { border-left-color: #333; }
.hot-card.xhs { border-left-color: #FF2442; }

.hot-card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.hot-platform {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 6px;
}
.hot-platform.dy { background: #333; color: #fff; }
.hot-platform.xhs { background: #FF2442; color: #fff; }

.hot-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 6px;
  line-height: 1.4;
}

.hot-meta {
  font-size: 12px;
  color: var(--text-light);
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.hot-tags {
  display: flex;
  gap: 5px;
  margin-top: 6px;
  flex-wrap: wrap;
}

.hot-tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 12px;
  background: var(--primary-bg);
  color: var(--primary-dark);
}

.auto-collect-info {
  background: linear-gradient(135deg, #FFF5F7, #F0EAFF);
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-sub);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.idea-item {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
  margin-bottom: 10px;
  border-left: 3px solid var(--secondary);
}

.idea-text {
  font-size: 15px;
  margin-bottom: 8px;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.5;
}

.idea-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.idea-time {
  font-size: 11px;
  color: var(--text-light);
}

.idea-actions {
  display: flex;
  gap: 6px;
  opacity: 0;
  transition: opacity .2s;
}
.idea-item:hover .idea-actions { opacity: 1; }

/* ==================== 体重记录 ==================== */
.weight-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}

.stat-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
  text-align: center;
}

.stat-label {
  font-size: 12px;
  color: var(--text-light);
  margin-bottom: 4px;
}

.stat-value {
  font-size: 22px;
  font-weight: 700;
  color: var(--primary-dark);
}
.stat-value .unit { font-size: 12px; font-weight: 400; }

.stat-trend {
  font-size: 11px;
  margin-top: 2px;
}
.stat-trend.up { color: var(--danger); }
.stat-trend.down { color: var(--success); }

.weight-chart-wrap {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
  overflow-x: auto;
}

.weight-chart {
  min-width: 300px;
  height: 180px;
}

.weight-input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  align-items: center;
}

.weight-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.weight-table th {
  text-align: left;
  padding: 8px 6px;
  color: var(--text-light);
  font-weight: 600;
  border-bottom: 1.5px solid var(--border);
  font-size: 12px;
}

.weight-table td {
  padding: 9px 6px;
  border-bottom: 1px solid var(--border);
}

.weight-table tr:hover { background: var(--bg-hover); }

.dinner-record {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  background: var(--bg-main);
  margin-bottom: 8px;
}

.dinner-date { font-size: 14px; font-weight: 500; }
.dinner-day { font-size: 11px; color: var(--text-light); }

.dinner-toggle {
  display: flex;
  gap: 6px;
}

.dinner-btn {
  padding: 5px 14px;
  border-radius: 16px;
  font-size: 12px;
  font-weight: 600;
  background: var(--bg-card);
  color: var(--text-sub);
  transition: all .2s;
}

.dinner-btn.active.eat {
  background: rgba(255, 140, 148, 0.15);
  color: var(--danger);
}

.dinner-btn.active.noeat {
  background: rgba(107, 203, 119, 0.15);
  color: var(--success);
}

/* ==================== 收支明细 ==================== */
.finance-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}

.summary-card {
  border-radius: var(--radius);
  padding: 16px;
  color: #fff;
  position: relative;
  overflow: hidden;
}

.summary-card.income { background: linear-gradient(135deg, #6BCB77, #4FA859); }
.summary-card.expense { background: linear-gradient(135deg, #FF8C94, #FF6B7A); }
.summary-card.extra { background: linear-gradient(135deg, #B5A8FF, #8E7FE8); }

<script>
/* ==================== 数据存储层 ==================== */
const STORAGE_PREFIX = 'spongeBaby_';
const DB_VERSION = '1.0';

const Store = {
  get(key, defaultValue = null) {
    try {
      const raw = localStorage.getItem(STORAGE_PREFIX + key);
      if (raw === null) return defaultValue;
      return JSON.parse(raw);
    } catch (e) {
      console.error('读取存储失败:', key, e);
      return defaultValue;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
      return true;
    } catch (e) {
      console.error('写入存储失败:', key, e);
      toast('存储空间不足，请清理浏览器数据');
      return false;
    }
  },
  remove(key) {
    localStorage.removeItem(STORAGE_PREFIX + key);
  }
};

/* ==================== 工具函数 ==================== */
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function nowTimeStr() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function dateTimeStr() {
  const d = new Date();
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function dayOfWeek(dateStr) {
  const days = ['周日','周一','周二','周三','周四','周五','周六'];
  return days[new Date(dateStr).getDay()];
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ==================== 应用名管理 ==================== */
let appName = Store.get('appName', '海绵饱饱');

function updateAppNameDisplay() {
  document.getElementById('appName').textContent = appName;
  document.getElementById('installAppName').textContent = appName;
  document.title = appName;
  // 更新 PWA meta
  let meta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if (meta) meta.setAttribute('content', appName);
}

function editAppName() {
  showModal({
    title: '✏️ 修改应用名称',
    body: `
      <div class="form-group">

        <div style="font-size:12px;color:var(--text-light);margin-top:6px;">最多12个字符，添加到桌面后图标显示此名称</div>
      </div>
    `,
    onConfirm: () => {
      const val = document.getElementById('appNameInput').value.trim();
      if (!val) { toast('名称不能为空'); return false; }
      appName = val;
      Store.set('appName', appName);
      updateAppNameDisplay();
      toast('名称已更新');
      return true;
    }
  });
  setTimeout(() => document.getElementById('appNameInput').focus(), 100);
}

function switchPage(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => {

  }
  // 滚动到顶部
  document.getElementById('main').scrollTop = 0;
}

function renderPage(page) {
  const main = document.getElementById('main');
  switch (page) {
    case 'checkin': main.innerHTML = renderCheckin(); initCheckin(); break;
    case 'memo': main.innerHTML = renderMemo(); initMemo(); break;

];

function getTasks() {
  return Store.get('checkin_tasks', DEFAULT_TASKS);
}

function getCheckinRecords() {
  // { '2026-07-28': ['t1','t3'] }
  return Store.get('checkin_records', {});
}

function getTodayChecked() {
  const records = getCheckinRecords();
  return records[todayStr()] || [];
}

function toggleCheckin(taskId) {
  const records = getCheckinRecords();
  const today = todayStr();
  if (!records[today]) records[today] = [];
  const idx = records[today].indexOf(taskId);
  if (idx >= 0) {
    records[today].splice(idx, 1);
  } else {
    records[today].push(taskId);
  }
  Store.set('checkin_records', records);
  // 重新渲染
  renderPage('checkin');
}

          <div class="progress-percent">${percent}%</div>
        </div>
        <div class="progress-info">
          <h3>今日完成 ${done}/${total}</h3>

function collectHotTopics() {
  const today = todayStr();
  const lastDate = getLastCollectDate();
  // 模拟采集：基于日期种子选取不同内容
  const seed = today.split('-').join('');
  const seedNum = parseInt(seed);
  
  const allDy = [...HOT_TOPICS_TEMPLATES.dy];
  const allXhs = [...HOT_TOPICS_TEMPLATES.xhs];
  
  // 打乱并选取
  const pickDy = [];
  const pickXhs = [];
  
  for (let i = 0; i < 5; i++) {
    const idx = (seedNum + i * 7) % allDy.length;
    if (!pickDy.includes(allDy[idx])) pickDy.push(allDy[idx]);
  }
  for (let i = 0; i < 5; i++) {
    const idx = (seedNum + i * 11) % allXhs.length;
    if (!pickXhs.includes(allXhs[idx])) pickXhs.push(allXhs[idx]);
  }
  
  const data = {
    date: today,
    collectedAt: nowTimeStr(),
    dy: pickDy.map(t => ({...t, id: uid()})),
    xhs: pickXhs.map(t => ({...t, id: uid()}))
  };
  
  Store.set('hot_topics', data);
  Store.set('last_collect_date', today);
  return data;
}

  const today = todayStr();
  if (getLastCollectDate() !== today) {

  }
}

function getWeightRecords() {

  // { '2026-07-28': 'eat' | 'noeat' }

}

function renderWeight() {
  const records = getWeightRecords().sort((a,b) => a.date.localeCompare(b.date));
  const dinnerRecords = getDinnerRecords();
  
  // 统计
  const today = todayStr();
  const todayRecord = records.find(r => r.date === today);
  const latest = records[records.length - 1];
  const yesterday = records.length >= 2 ? records[records.length - 2] : null;
  const maxW = records.length ? Math.max(...records.map(r => r.weight)) : 0;
  const minW = records.length ? Math.min(...records.map(r => r.weight)) : 0;
  
  let diff = 0, diffText = '—', diffClass = '';
  if (latest && yesterday) {
    diff = (latest.weight - yesterday.weight).toFixed(1);
    diffText = (diff > 0 ? '+' : '') + diff + ' kg';
    diffClass = diff > 0 ? 'up' : diff < 0 ? 'down' : '';
  }
  
  // 本月记录
  const now = new Date();
  const monthPrefix = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const monthRecords = records.filter(r => r.date.startsWith(monthPrefix)).sort((a,b) => b.date.localeCompare(a.date));
  
  // 晚餐记录 - 最近14天
  const dinnerList = [];
  for (let i = 0; i < 14; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    dinnerList.push({ date: ds, day: dayOfWeek(ds), status: dinnerRecords[ds] || null });
  }
  
  // 绘制趋势图
  let chartHtml = '';
  if (records.length >= 2) {
    chartHtml = renderWeightChart(records.slice(-15));
  } else {
    chartHtml = `<div class="empty-state" style="padding:20px"><div class="empty-state-text">记录2条以上体重后显示趋势图</div></div>`;
  }
  
  let tableHtml = '';
  if (monthRecords.length === 0) {
    tableHtml = `<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-text">本月暂无记录</div></div>`;
  } else {
    tableHtml = `
      <table class="weight-table">
        <thead><tr><th>日期</th><th>星期</th><th>体重(kg)</th><th>变化</th><th></th></tr></thead>
        <tbody>
          ${monthRecords.map((r, idx) => {
            const prev = monthRecords[idx + 1];
            let change = '';
            if (prev) {
              const d = (r.weight - prev.weight).toFixed(1);
              change = d > 0 ? `<span class="stat-trend up">+${d}</span>` : d < 0 ? `<span class="stat-trend down">${d}</span>` : `<span style="color:var(--text-light)">持平</span>`;
            } else {
              change = `<span style="color:var(--text-light)">—</span>`;
            }
            return `<tr>
              <td>${r.date.slice(5)}</td>
              <td style="color:var(--text-light)">${dayOfWeek(r.date)}</td>
              <td><b>${r.weight}</b></td>
              <td>${change}</td>
              <td><button class="btn-icon btn-danger" style="width:24px;height:24px;font-size:12px" onclick="deleteWeight('${r.id}')">🗑</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    `;
  }
  
  const dinnerHtml = dinnerList.map(d => `
    <div class="dinner-record">
      <div>
        <div class="dinner-date">${d.date.slice(5)}</div>
        <div class="dinner-day">${d.day}</div>

function renderWeightChart(records) {
  const w = 320, h = 160, pad = { l: 30, r: 15, t: 15, b: 25 };
  const cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
  const weights = records.map(r => r.weight);
  const minW = Math.min(...weights) - 0.5;
  const maxW = Math.max(...weights) + 0.5;
  const range = maxW - minW || 1;
  
  const points = records.map((r, i) => {
    const x = pad.l + (records.length === 1 ? cw/2 : (i / (records.length - 1)) * cw);
    const y = pad.t + ch - ((r.weight - minW) / range) * ch;
    return { x, y, ...r };
  });
  
  const pathD = points.map((p, i) => `${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const areaD = pathD + ` L${points[points.length-1].x.toFixed(1)},${pad.t+ch} L${points[0].x.toFixed(1)},${pad.t+ch} Z`;
  
  const yLabels = [minW, (minW+maxW)/2, maxW].map(v => v.toFixed(1));
  
  return `
    <svg class="weight-chart" viewBox="0 0 ${w} ${h}" style="width:100%;max-width:400px;display:block;margin:0 auto">
      <defs>
        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FF9FB5" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#FF9FB5" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${yLabels.map((v, i) => {
        const y = pad.t + (i / 2) * ch;
        return `<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="#F0E4ED" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="${pad.l-5}" y="${y+3}" font-size="9" fill="#B5A8C4" text-anchor="end">${v}</text>`;
      }).join('')}
      <path d="${areaD}" fill="url(#areaGrad)"/>
      <path d="${pathD}" fill="none" stroke="#FF7FA0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${points.map(p => `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#fff" stroke="#FF7FA0" stroke-width="2"/>`).join('')}
      ${points.map((p, i) => {
        if (records.length > 8 && i % 2 !== 0) return '';
        return `<text x="${p.x}" y="${h-8}" font-size="8" fill="#B5A8C4" text-anchor="middle">${p.date.slice(5)}</text>`;
      }).join('')}
    </svg>
  `;
}

/* ==================== 数据备份/恢复（隐藏功能） ==================== */
function exportData() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith(STORAGE_PREFIX)) {
      data[key] = localStorage.getItem(key);
    }
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `海绵饱饱_备份_${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('备份文件已下载');
}

/* ==================== 初始化 ==================== */
function init() {
  updateAppNameDisplay();
  
  // 首次访问初始化默认数据
  if (Store.get('initialized') !== true) {
    Store.set('checkin_tasks', DEFAULT_TASKS);
    Store.set('memo_categories', DEFAULT_MEMO_CATEGORIES);
    Store.set('finance_cats', DEFAULT_FINANCE_CATS);
    Store.set('memos', [
      { id: uid(), cat: 'purchase', text: '示例：买抽纸', done: false, createdAt: Date.now(), createdAtStr: dateTimeStr() },
      { id: uid(), cat: 'daily', text: '示例：周三前交水电费', done: false, createdAt: Date.now(), createdAtStr: dateTimeStr() }
    ]);
    Store.set('initialized', true);
    Store.set('init_version', DB_VERSION);
  }
  
  // 尝试自动采集今日爆款
  tryAutoCollect();
  
  // 渲染首页
  renderPage('checkin');
  
  // 每分钟检查一次是否需要自动采集（9点触发）
  setInterval(() => {
    const now = new Date();
    if (now.getHours() === 9 && now.getMinutes() < 1) {
      if (getLastCollectDate() !== todayStr()) {
        collectHotTopics();
        if (currentPage === 'inspiration') renderPage('inspiration');
      }
    }
  }, 60000);
  
  // 长按侧边栏logo显示备份选项（彩蛋）
  let pressTimer;
  const logo = document.querySelector('.sidebar-logo');
  if (logo) {
    logo.addEventListener('touchstart', () => {
      pressTimer = setTimeout(() => {
        showConfirm('导出所有数据为备份文件？', () => exportData());
      }, 1500);
    });
    logo.addEventListener('touchend', () => clearTimeout(pressTimer));
  }
}

// 启动
document.addEventListener('DOMContentLoaded', init);
if (document.readyState !== 'loading') init();

// 防止双击缩放
let lastTouch = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouch <= 300) e.preventDefault();
  lastTouch = now;
}, { passive: false });

// 监听键盘回车提交
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && document.getElementById('modalOverlay').classList.contains('show')) {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'textarea') {
      document.getElementById('modalConfirmBtn')?.click();
    }
  }
});
</script>
</body>
</html>
